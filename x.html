<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DBA Dash Alert</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f4f6f8; padding:25px 0;">

    <tr>
        <td align="center">

            <table width="700" cellpadding="0" cellspacing="0" border="0"
                   style="width:700px;
                          max-width:700px;
                          background-color:#ffffff;
                          border:1px solid #dcdcdc;
                          border-radius:6px;
                          overflow:hidden;">

                <tr>
                    <td style="background-color:#b71c1c;
                               color:#ffffff;
                               padding:18px 24px;
                               font-size:21px;
                               font-weight:bold;">
                        ⚠ DBA DASH ALERT
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px;">

                        <table width="100%" cellpadding="8" cellspacing="0" border="0"
                               style="border-collapse:collapse; font-size:14px;">

                            <tr>
                                <td style="width:170px;
                                           font-weight:bold;
                                           color:#555555;
                                           border-bottom:1px solid #eeeeee;">
                                    Instance
                                </td>

                                <td style="color:#222222;
                                           font-weight:bold;
                                           border-bottom:1px solid #eeeeee;">
                                    {InstanceAndConnectionID}
                                </td>
                            </tr>

                            <tr>
                                <td style="font-weight:bold;
                                           color:#555555;
                                           border-bottom:1px solid #eeeeee;">
                                    Trigger Time
                                </td>

                                <td style="color:#222222;
                                           border-bottom:1px solid #eeeeee;">
                                    {TriggerDate}
                                </td>
                            </tr>

                        </table>

                    </td>
                </tr>

                <tr>
                    <td style="background-color:#eeeeee;
                               padding:12px 24px;
                               font-size:11px;
                               color:#777777;
                               text-align:center;">

                        This notification was generated automatically by DBA Dash.

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
